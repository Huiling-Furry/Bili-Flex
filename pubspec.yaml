name: biliflex
description: "BiliFlex - 一款独立架构的 B 站第三方 Flutter 客户端。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理（Riverpod，区别于常见的 GetX 方案）
  flutter_riverpod: ^2.6.1
  # 路由
  go_router: ^14.6.2
  # 网络
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0
  # 本地存储
  shared_preferences: ^2.3.3
  # 图片
  cached_network_image: ^3.4.1
  # 工具
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  intl: ^0.19.0
  crypto: ^3.0.6
  # 二维码登录
  qr_flutter: ^4.1.0
  # 视频播放（Windows/Linux/macOS/Android/iOS，基于 libmpv）
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
