<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiliFlex - B站第三方客户端原型</title>
<style>
/* ============ 全局 ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pink:#FB7299;--pink-light:#FF85AD;--pink-dark:#E85A82;
  --blue:#00AEEC;--bg:#F4F5F7;--card:#fff;--text:#18191C;
  --text2:#61666D;--text3:#9499A0;--border:#E3E5E7;
  --shadow:0 2px 8px rgba(0,0,0,.06);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

/* ============ 布局 ============ */
.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;padding-bottom:60px}
@media(min-width:768px){.app{max-width:100%;padding-bottom:0;padding-left:72px}}
.view{display:none;min-height:100vh}
.view.active{display:block}

/* ============ 顶部栏 ============ */
.topbar{position:sticky;top:0;z-index:100;background:var(--card);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.topbar .logo{font-size:20px;font-weight:800;color:var(--pink);letter-spacing:-0.5px}
.topbar .search-box{flex:1;background:var(--bg);border-radius:20px;padding:7px 14px;font-size:13px;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:6px}
.topbar .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--blue));flex-shrink:0}

/* ============ 底部导航 ============ */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:200;padding:4px 0 8px}
@media(min-width:768px){.tabbar{position:fixed;left:0;top:0;transform:none;width:72px;height:100vh;flex-direction:column;justify-content:flex-start;padding-top:20px;border-right:1px solid var(--border);border-top:none}}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--text3);font-size:10px;transition:color .2s}
@media(min-width:768px){.tab-item{flex:none;padding:14px 0;font-size:10px}}
.tab-item.active{color:var(--pink)}
.tab-item svg{width:22px;height:22px}
@media(min-width:768px){.tab-item svg{width:24px;height:24px}}

/* ============ 首页 ============ */
.home-tabs{display:flex;background:var(--card);padding:0 16px;border-bottom:1px solid var(--border);position:sticky;top:53px;z-index:90}
.home-tab{padding:12px 16px;font-size:14px;color:var(--text2);cursor:pointer;position:relative;font-weight:500}
.home-tab.active{color:var(--pink);font-weight:700}
.home-tab.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:3px;background:var(--pink);border-radius:2px}
.video-grid{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:768px){.video-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:20px}}
.video-card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.video-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.video-cover{position:relative;aspect-ratio:16/10;background:#ddd}
.video-cover img{width:100%;height:100%;object-fit:cover}
.video-duration{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 5px;border-radius:3px}
.video-info{padding:8px 10px 10px}
.video-title{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--text3)}
.video-meta .up{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ 视频详情页 ============ */
.video-detail{position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;background:var(--bg);overflow-y:auto;display:none}
.video-detail.active{display:block}
.player-area{aspect-ratio:16/9;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
.player-area .play-btn{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
.player-area .play-btn svg{width:28px;height:28px;fill:#fff;margin-left:3px}
.player-controls{position:absolute;bottom:0;left:0;right:0;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;align-items:center;gap:10px}
.player-controls .progress{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;cursor:pointer;position:relative}
.player-controls .progress-fill{height:100%;background:var(--pink);border-radius:2px;width:35%}
.player-controls .time{color:#fff;font-size:11px;white-space:nowrap}
.player-controls .ctrl-btn{color:#fff;cursor:pointer;font-size:12px;white-space:nowrap}
.video-detail-body{padding:14px 16px}
.vd-title{font-size:17px;font-weight:700;line-height:1.4}
.vd-stats{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--text3)}
.vd-up{display:flex;align-items:center;gap:10px;margin:14px 0;padding:12px;background:var(--card);border-radius:10px}
.vd-up .up-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--blue))}
.vd-up .up-info{flex:1}
.vd-up .up-name{font-size:14px;font-weight:600}
.vd-up .up-fans{font-size:11px;color:var(--text3)}
.vd-up .follow-btn{background:var(--pink);color:#fff;border:none;padding:6px 16px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer}
.vd-actions{display:flex;justify-content:space-around;padding:14px;background:var(--card);border-radius:10px;margin-bottom:14px}
.vd-action{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--text2);font-size:11px}
.vd-action svg{width:22px;height:22px}
.vd-action.liked{color:var(--pink)}
.vd-section-title{font-size:15px;font-weight:700;margin:16px 0 10px}
.back-btn{position:absolute;top:12px;left:12px;z-index:10;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}

/* ============ 搜索页 ============ */
.search-input-row{padding:10px 16px;background:var(--card);display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border)}
.search-input{flex:1;background:var(--bg);border:none;border-radius:20px;padding:9px 16px;font-size:14px;outline:none}
.search-cancel{color:var(--pink);font-size:14px;cursor:pointer;font-weight:500}
.hot-search{padding:16px}
.hot-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.hot-list{display:flex;flex-wrap:wrap;gap:8px}
.hot-tag{background:var(--card);padding:7px 14px;border-radius:16px;font-size:13px;cursor:pointer;color:var(--text2);border:1px solid var(--border)}
.hot-tag .rank{color:var(--pink);font-weight:700;margin-right:4px}
.search-result{padding:10px 16px}

/* ============ 直播页 ============ */
.live-grid{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:768px){.live-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:20px}}
.live-card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer}
.live-cover{position:relative;aspect-ratio:16/10;background:#ddd}
.live-cover img{width:100%;height:100%;object-fit:cover}
.live-badge{position:absolute;top:6px;left:6px;background:var(--pink);color:#fff;font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600;display:flex;align-items:center;gap:3px}
.live-badge::before{content:'';width:5px;height:5px;background:#fff;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-viewers{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 5px;border-radius:3px}
.live-info{padding:8px 10px 10px}
.live-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-up{font-size:11px;color:var(--text3);margin-top:4px}

/* ============ 私信页 ============ */
.msg-layout{display:flex;height:calc(100vh - 60px)}
@media(min-width:768px){.msg-layout{height:100vh}}
.msg-session-list{width:100%;border-right:1px solid var(--border);background:var(--card);overflow-y:auto}
.msg-session-list.hidden{display:none}
@media(min-width:768px){.msg-session-list{width:280px;flex-shrink:0}}
.msg-chat-panel{flex:1;display:none;flex-direction:column;background:var(--bg)}
.msg-chat-panel.active{display:flex}
@media(min-width:768px){.msg-chat-panel{display:flex}}
.session-item{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border);position:relative}
.session-item:hover{background:var(--bg)}
.session-item.active{background:#FFF0F5}
.session-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--blue));flex-shrink:0;position:relative}
.session-unread{position:absolute;top:-2px;right:-2px;background:var(--pink);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}
.session-info{flex:1;min-width:0}
.session-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-last{font-size:12px;color:var(--text3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-time{font-size:11px;color:var(--text3);flex-shrink:0}
.chat-header{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.chat-back{cursor:pointer;color:var(--text2);display:flex}
@media(min-width:768px){.chat-back{display:none}}
.chat-title{font-size:15px;font-weight:600;flex:1}
.chat-messages{flex:1;overflow-y:auto;padding:14px 12px}
.msg-row{display:flex;margin-bottom:14px;gap:8px}
.msg-row.self{flex-direction:row-reverse}
.msg-avatar-sm{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--blue));flex-shrink:0}
.msg-bubble{max-width:70%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word}
.msg-row:not(.self) .msg-bubble{background:var(--card);border-bottom-left-radius:4px}
.msg-row.self .msg-bubble{background:var(--pink);color:#fff;border-bottom-right-radius:4px}
.msg-system{text-align:center;margin:12px 0}
.msg-system span{background:var(--border);color:var(--text3);font-size:11px;padding:3px 10px;border-radius:10px}
.msg-time-label{text-align:center;font-size:11px;color:var(--text3);margin:8px 0}
.msg-card{background:var(--card);border-radius:10px;overflow:hidden;max-width:min(440px,92%);width:100%;cursor:pointer;box-shadow:var(--shadow)}
.msg-card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.msg-card-info{padding:8px 10px}
.msg-card-title{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg-card-meta{font-size:11px;color:var(--text3);margin-top:4px}
/* 系统推送类卡片（UP更新视频/系统通知/动态·专栏）在聊天窗口中居中 */
.msg-push{display:flex;flex-direction:column;align-items:center;margin:14px 0}
.msg-push-tag{font-size:10px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1px 8px;margin-bottom:6px}
.chat-input-row{padding:10px 12px;background:var(--card);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.chat-input{flex:1;background:var(--bg);border:none;border-radius:20px;padding:9px 14px;font-size:14px;outline:none}
.chat-send{background:var(--pink);color:#fff;border:none;padding:8px 16px;border-radius:18px;font-size:13px;font-weight:600;cursor:pointer}

/* ============ 我的页 ============ */
.profile-header{background:linear-gradient(135deg,var(--pink),var(--pink-dark));padding:30px 20px 40px;color:#fff}
.profile-user{display:flex;align-items:center;gap:14px}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.5)}
.profile-name{font-size:20px;font-weight:700}
.profile-uid{font-size:12px;opacity:.8;margin-top:2px}
.profile-stats{display:flex;justify-content:space-around;margin-top:20px;text-align:center}
.profile-stat-num{font-size:18px;font-weight:700}
.profile-stat-label{font-size:11px;opacity:.8;margin-top:2px}
.profile-menu{margin:-20px 14px 14px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.profile-menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--border)}
.profile-menu-item:last-child{border-bottom:none}
.profile-menu-item svg{width:20px;height:20px;color:var(--text2)}
.profile-menu-item span{flex:1;font-size:14px}
.profile-menu-item .arrow{color:var(--text3)}

/* ============ 弹幕 ============ */
.danmaku-layer{position:absolute;top:0;left:0;right:0;bottom:40px;overflow:hidden;pointer-events:none}
.danmaku-item{position:absolute;white-space:nowrap;color:#fff;font-size:14px;text-shadow:1px 1px 2px rgba(0,0,0,.8);animation:danmaku-scroll 8s linear forwards}
@keyframes danmaku-scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

/* ============ Toast ============ */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* ============ 媒体列表 tile ============ */
.media-tile{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);align-items:flex-start;background:#fff}
.media-tile:last-child{border-bottom:none}
.media-tile .cover{width:100px;height:56px;border-radius:6px;background:#ddd;overflow:hidden;flex-shrink:0}
.media-tile .info{flex:1;min-width:0}
.media-tile .title{font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.media-tile .author{font-size:11px;color:var(--text3);margin-top:3px}
.media-tile .stats{font-size:11px;color:var(--text3);margin-top:2px}

/* ============ spinner ============ */
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
.spinner-sm{width:16px;height:16px;border-width:2px}
.spinner-lg{width:36px;height:36px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <!-- ============ 首页 ============ -->
  <div class="view active" id="view-home">
    <div class="topbar">
      <div class="logo">BiliFlex</div>
      <div class="search-box" onclick="switchTab('search')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        搜索你感兴趣的内容
      </div>
      <div class="avatar"></div>
    </div>
    <div class="home-tabs">
      <div class="home-tab active" data-tab="recommend" onclick="switchHomeTab('recommend')">推荐</div>
      <div class="home-tab" data-tab="popular" onclick="switchHomeTab('popular')">热门</div>
    </div>
    <div class="video-grid" id="video-grid"></div>
  </div>

  <!-- ============ 搜索页 ============ -->
  <div class="view" id="view-search">
    <div class="search-input-row">
      <input class="search-input" id="search-input" placeholder="搜索视频、UP主、番剧..." onkeydown="if(event.key==='Enter')doSearch()">
      <span class="search-cancel" onclick="switchTab('home')">取消</span>
    </div>
    <div class="hot-search" id="hot-search">
      <div class="hot-title">🔥 热门搜索</div>
      <div class="hot-list" id="hot-list"></div>
    </div>
    <div class="search-result" id="search-result" style="display:none"></div>
  </div>

  <!-- ============ 直播页 ============ -->
  <div class="view" id="view-live">
    <div class="topbar"><div class="logo">直播</div></div>
    <div class="live-grid" id="live-grid"></div>
  </div>

  <!-- ============ 消息页 ============ -->
  <div class="view" id="view-message">
    <div class="msg-layout">
      <div class="msg-session-list" id="session-list">
        <div class="topbar" style="position:sticky;top:0"><div class="logo">消息</div></div>
        <div id="session-items"></div>
      </div>
      <div class="msg-chat-panel" id="chat-panel">
        <div class="chat-header">
          <span class="chat-back" onclick="closeChat()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="m15 18-6-6 6-6"/></svg>
          </span>
          <span class="chat-title" id="chat-title">聊天</span>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-row">
          <input class="chat-input" id="chat-input" placeholder="发送消息..." onkeydown="if(event.key==='Enter')sendChatMsg()">
          <button class="chat-send" onclick="sendChatMsg()">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 我的页 ============ -->
  <div class="view" id="view-profile">
    <div class="profile-header">
      <div class="profile-user">
        <div class="profile-avatar"></div>
        <div>
          <div class="profile-name">BiliFlex用户</div>
          <div class="profile-uid">UID: 10086520</div>
        </div>
      </div>
      <div class="profile-stats">
        <div><div class="profile-stat-num">128</div><div class="profile-stat-label">关注</div></div>
        <div><div class="profile-stat-num">2.3万</div><div class="profile-stat-label">粉丝</div></div>
        <div><div class="profile-stat-num">56</div><div class="profile-stat-label">硬币</div></div>
        <div><div class="profile-stat-num">12</div><div class="profile-stat-label">收藏夹</div></div>
      </div>
    </div>
    <div class="profile-menu">
      <div class="profile-menu-item" onclick="openHistory()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span>观看历史</span><span class="arrow">›</span>
      </div>
      <div class="profile-menu-item" onclick="openFavList()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
        <span>我的收藏</span><span class="arrow">›</span>
      </div>
      <div class="profile-menu-item" onclick="openWatchLater()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span>稍后再看</span><span class="arrow">›</span>
      </div>
      <div class="profile-menu-item" onclick="switchTab('message')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>私信</span><span class="arrow">›</span>
      </div>
      <div class="profile-menu-item" onclick="CookieStore.loggedIn?logout():openLogin()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>${CookieStore.loggedIn?'退出登录':'登录 / 切换账号'}</span><span class="arrow">›</span>
      </div>
    </div>
  </div>

  <!-- ============ 视频详情页（全屏覆盖） ============ -->
  <div class="video-detail" id="video-detail">
    <div class="player-area" id="player-area" style="aspect-ratio:16/9;background:#000">
      <div class="back-btn" onclick="closeVideo()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="m15 18-6-6 6-6"/></svg>
      </div>
      <canvas class="danmaku-layer" id="danmaku-canvas"></canvas>
      <video id="video-player" playsinline preload="metadata" style="width:100%;height:100%;display:block;background:#000" controlslist="nodownload"></video>

// CORS 代理列表（按优先级尝试）
const CORS_PROXIES = [
  url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  url => 'https://corsproxy.io/?url=' + encodeURIComponent(url),
  url => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(url),
];

async function biliFetch(url, opts={}, timeout=8000) {
  opts.headers = opts.headers || {};
  opts.headers['Referer']='https://www.bilibili.com';
  opts.headers['User-Agent']='Mozilla/5.0';
  // 自动带上 Cookie（需要用户先通过 Cookie 粘贴登录）
  const cookie = CookieStore.load();
  if(cookie && !opts.headers['Cookie']) opts.headers['Cookie']=cookie;

  let lastErr;
  for (const proxy of CORS_PROXIES) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      const method = opts.method||'GET';
      let realUrl;
      let fetchOpts = {signal: controller.signal, method, headers: opts.headers};
      if(opts.body){fetchOpts.body = opts.body}
      if(method==='POST' && proxy===CORS_PROXIES[0]){
        // allorigins 对 POST 需要 method 参数
        realUrl = 'https://api.allorigins.win/raw?method=POST&url='+encodeURIComponent(url);
      }else if(method==='POST'){
        realUrl = 'https://corsproxy.io/?url='+encodeURIComponent(url);
      }else{
        realUrl = proxy(url);
      }
      const resp = await fetch(realUrl, fetchOpts);
      clearTimeout(timer);
      if (!resp.ok) throw new Error('HTTP '+resp.status);
      const text = await resp.text();
      const data = JSON.parse(text);
      if (data.code !== 0) throw new Error('API code '+data.code+': '+(data.message||''));
      return data;
    } catch(e) { lastErr = e; }
  }
  throw lastErr || new Error('所有代理均失败');
}

// WBI 签名
const MIXIN_KEY_ENC_TAB = [46,47,18,2,53,8,23,32,15,50,10,31,58,3,45,35,27,43,5,49,33,9,42,19,29,28,14,39,12,38,41,13,37,48,7,16,24,55,40,61,26,17,0,1,60,51,30,4,22,25,54,21,56,59,6,63,57,62,11,36,20,34,44,52];
let _wbiKeys = null;
async function getWbiKeys(){
  if(_wbiKeys) return _wbiKeys;
  const nav = await biliFetch('https://api.bilibili.com/x/web-interface/nav');
  const imgUrl = nav.data.wbi_img.img_url;
  const subUrl = nav.data.wbi_img.sub_url;
  _wbiKeys = {
    imgKey: imgUrl.split('/').pop().split('.')[0],
    subKey: subUrl.split('/').pop().split('.')[0]
  };
  return _wbiKeys;
}
function getMixinKey(orig){return MIXIN_KEY_ENC_TAB.map(i=>orig[i]).join('').slice(0,32)}
async function wbiSign(params){
  const {imgKey,subKey} = await getWbiKeys();
  const mixinKey = getMixinKey(imgKey+subKey);
  const wts = Math.floor(Date.now()/1000);
  const query = {...params, wts};
  const sorted = {};
  Object.keys(query).sort().forEach(k=>{sorted[k]=encodeURIComponent(query[k])});
  const queryStr = Object.entries(sorted).map(([k,v])=>k+'='+v).join('&');
  const w_rid = md5(queryStr+mixinKey);
  return {...query, w_rid};
}

// 数字格式化
function fmtNum(n){
  if(n>=10000) return (n/10000).toFixed(1)+'万';
  if(n>=1000) return (n/1000).toFixed(1)+'千';
  return String(n);
}
function fmtDuration(sec){
  if(!sec) return '00:00';
  const m=Math.floor(sec/60),s=sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
// HTML 转义（真实接口返回的文本直接插入 innerHTML 前先转义）
function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// ============ 真实弹幕 Protobuf 解析 ============
// B 站 dm seg.so 弹幕简化 protobuf 解析
function parseDanmaku(buf){
  const bytes=new Uint8Array(buf);
  const items=[];let i=0;
  function readVarint(){let v=0,sh=0;while(true){const b=bytes[i++];v|=(b&0x7f)<<sh;sh+=7;if(!(b&0x80))break}return v}
  function readString(len){const s=new TextDecoder().decode(bytes.slice(i,i+len));i+=len;return s}
  function zigzag(n){return(n>>>1)^-(n&1)}

  while(i<bytes.length-4){
    try{
      // 外层：repeated DanmakuElem item = 1 (tag 1, length-delimited)
      const tag=bytes[i++];
      if(tag!==0x0a){i++;continue}
      let len=readVarint(),end=i+len;
      let item={progress:0,mode:1,size:25,color:0xffffff,text:'',midHash:''};
      while(i<end){
        const t=bytes[i++];
        const wire=t&0x07,num=t>>>3;
        if(wire===0){// varint
          const v=readVarint();
          if(num===2)item.progress=v;         // field 2: progress ms
          else if(num===3)item.mode=v;        // field 3: mode (1滚动 2 3 底部 4 5 顶部 7高级)
          else if(num===4)item.size=v;        // field 4: font size scale
          else if(num===5)item.color=v;       // field 5: color rgb hex
          else if(num===7)item.sendTime=v;    // field 7: send_time (seconds)
          else if(num===8)item.pool=v;        // field 8: pool
          else if(num===9)item.weight=v;      // field 9: weight
          else if(num===12)item.id=v;         // field 12: id (segment)
        }else if(wire===2){// length-delimited
          const l=readVarint();
          if(num===6)item.text=readString(l); // field 6: text
          else if(num===1)item.midHash=readString(l); // field 1: sender mid hash
          else i+=l;
        }else break;
      }
      if(item.text)items.push(item);
      i=end;
    }catch(e){i++;if(i>bytes.length-10)break}
  }
  return items;
}

// ============ Canvas 弹幕渲染 ============
let danmakuData=[],danmakuCanvas,danmakuCtx,danmakuActive=false,danmakuTimer=null;
let danmakuTraces=[]; // 每条弹幕的状态 {x,y,text,color,mode,size,speed}

function initDanmakuCanvas(){
  danmakuCanvas=document.getElementById('danmaku-canvas');
  if(!danmakuCanvas)return;
  const fit=()=>{
    const parent=document.getElementById('player-area');
    if(!parent)return;
    const w=parent.clientWidth,h=parent.clientHeight;
    danmakuCanvas.width=w*devicePixelRatio;danmakuCanvas.height=h*devicePixelRatio;
    danmakuCanvas.style.width=w+'px';danmakuCanvas.style.height=h+'px';
    danmakuCtx=danmakuCanvas.getContext('2d');danmakuCtx.scale(devicePixelRatio,devicePixelRatio);
  };
  fit();
  window._dmFit=fit;window.addEventListener('resize',fit);
}
function startDanmakuLoop(){
  if(!danmakuCtx)return;
  stopDanmakuLoop();
  const tick=()=>{
    danmakuCtx.clearRect(0,0,danmakuCanvas.width,danmakuCanvas.height);
    const now=videoPlayer.currentTime; // 秒
    const w=danmakuCanvas.width/devicePixelRatio,h=danmakuCanvas.height/devicePixelRatio;
    const fontBase=16;
    danmakuData.forEach(d=>{
      const sec=(d.progress||0)/1000; // protobuf 里是毫秒，转秒
      if(Math.abs(sec-now)<0.2 && !d._launched){
        d._launched=true;
        const sizePx=(d.size||25)/25*fontBase;
        const font=sizePx+'px sans-serif';
        danmakuCtx.font=font;
        const tw=danmakuCtx.measureText(d.text).width;
        danmakuTraces.push({
          x:w+10,y:Math.random()*(h-sizePx*2)+sizePx,
          text:d.text,color:'#'+d.color.toString(16).padStart(6,'0'),
          sizePx,mode:d.mode||1,
          speed:(w+tw)/8000 // 8秒横穿
        });
      }
    });
    // 更新绘制
    danmakuTraces.forEach(t=>{
      t.x-=t.speed*16;
      danmakuCtx.fillStyle=t.color;
      danmakuCtx.strokeStyle='rgba(0,0,0,0.7)';
      danmakuCtx.lineWidth=2;
      danmakuCtx.font=t.sizePx+'px sans-serif';
      danmakuCtx.textBaseline='middle';
      danmakuCtx.strokeText(t.text,t.x,t.y);
      danmakuCtx.fillText(t.text,t.x,t.y);
    });
    danmakuTraces=danmakuTraces.filter(t=>t.x>-300);
    danmakuTimer=requestAnimationFrame(tick);
  };
  danmakuTimer=requestAnimationFrame(tick);
}
function stopDanmakuLoop(){if(danmakuTimer){cancelAnimationFrame(danmakuTimer);danmakuTimer=null}danmakuTraces=[]}
function startDanmaku(){
  danmakuActive=true;
  document.getElementById('danmaku-canvas').style.display='block';
  startDanmakuLoop();
}
function stopDanmaku(){
  danmakuActive=false;
  document.getElementById('danmaku-canvas').style.display='none';
  stopDanmakuLoop();
}
async function loadDanmaku(cid,totalDuration=300){
  danmakuData=[];
  if(!cid)return;
  const segs=Math.min(Math.ceil(totalDuration/360)+1,8);
  for(let i=1;i<=segs;i++){
    try{
      const url='https://api.bilibili.com/x/v2/dm/web/seg.so?type=1&oid='+cid+'&segment_index='+i;
      const resp=await fetch(url,{headers:{Cookie:CookieStore.load(),Referer:'https://www.bilibili.com'}});
      if(!resp.ok)continue;
      const bytes=new Uint8Array(await resp.arrayBuffer());
      const items=parseDanmaku(bytes);
      danmakuData.push(...items);
    }catch(e){}
  }
  danmakuData.sort((a,b)=>a.progress-b.progress);
}

async function loadPlayUrl(bvid,aid,cid,qn=80){

    const u='https://api.bilibili.com/x/player/wbi/playurl?'+new URLSearchParams(signed).toString();

function pickDurlByQn(durl,qn){
  // durl 结构简化为 [{url,backup_url:[],id,quality,length,size}]
  if(!durl||!durl.length)return null;
  if(qn){const f=durl.find(d=>d.id===qn);if(f)return f}
  return durl.sort((a,b)=>b.id-a.id)[0];
}
async function pickDashByQn(dash,qn){
  // dash.video / dash.audio: [{baseUrl,backupUrl[],qualityType,codecs,width,height,frameRate...}]
  if(!dash)return null;
  const videos=dash.video||[];
  const audios=dash.audio||[];
  let v=videos[0],a=null;
  if(qn){const f=videos.find(x=>x.qualityType===qn);if(f)v=f}
  v=v||videos.sort((a,b)=>(b.height*b.frameRate)-(a.height*a.frameRate))[0];
  a=audios.sort((x,y)=>y.bandwidth-x.bandwidth)[0];
  return{v,a};
}

}

function fmtSessionTime(ts){
  if(!ts) return '';
  const d=new Date(ts*1000),now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  if(d.toDateString()===now.toDateString()) return pad(d.getHours())+':'+pad(d.getMinutes());
  const y=new Date(now.getTime()-86400000);
  if(d.toDateString()===y.toDateString()) return '昨天';
  return (d.getMonth()+1)+'-'+d.getDate();
}
function previewLastMsg(lm){
  if(!lm||!lm.content) return '[消息]';
  let c={};try{c=JSON.parse(lm.content)}catch(e){return String(lm.content)}
  switch(lm.msg_type){
    case 1: return c.content||'[消息]';
    case 2: return '[图片]';
    case 7: return '[视频] '+(c.title||'');
    case 10: return c.content||'[系统消息]';
    default: return c.content||c.title||'[消息]';
  }
}
// 会话列表真实接口
async function fetchRealSessions(){
  if(!CookieStore.loggedIn) return null;
  const d=await biliFetch('https://api.vc.bilibili.com/session_svr/v1/session_svr/get_sessions?session_type=1&group_id=0&sort_rule=2&build=0&mobi_app=web',{},8000);
  const list=(d.data&&d.data.session_list)||[];
  if(!list.length) return null;
  const items=list.slice(0,20);
  // 批量取用户名片（失败时用 UID 兜底）
  const cards={};
  try{
    const uids=items.map(s=>s.talker_id).join(',');
    const r=await biliFetch('https://api.vc.bilibili.com/account/v1/user/cards?uids='+uids,{},8000);
    (r.data||[]).forEach(u=>{cards[u.uid]={name:u.name,face:u.face}});
  }catch(e){}
  return items.map(s=>{
    const u=cards[s.talker_id]||{};
    const lm=s.last_msg||{};
    return {
      id:s.talker_id,
      name:u.name||('UID '+s.talker_id),
      face:u.face||'',
      last:previewLastMsg(lm),
      time:fmtSessionTime(s.at_time||lm.timestamp),
      unread:s.unread_count||0,
      real:true
    };
  });
}
// 单条消息 → 渲染结构
function mapRealMsg(m,myMid){
  const self=String(m.sender_uid)===String(myMid);
  let c={};try{c=JSON.parse(m.content||'{}')}catch(e){c={content:m.content}}
  const fix=u=>(u||'').replace(/^http:/,'https:');
  switch(m.msg_type){
    case 1:  return {type:'text',self,text:esc(c.content||'')};
    case 2:  return {type:'image',self,url:fix(c.url),w:c.width,h:c.height};
    case 5:  return {type:'system',text:'对方撤回了一条消息'};
    case 7:  return {type:'share',self,source:c.source===2?'视频':'动态',title:esc(c.title||c.bvid||'分享内容'),cover:fix(c.cover),up:esc(c.author||'')};
    case 10: return {type:'system',text:esc(c.content||'')};
    default:
      if(c.content) return {type:'text',self,text:esc(c.content)};
      if(c.title)   return {type:'share',self,source:'动态',title:esc(c.title),cover:fix(c.cover),up:esc(c.author||'')};
      return null;
  }
}
// 聊天记录真实接口
async function fetchRealMessages(talkerId){
  const myMid=CookieStore.mid;
  const d=await biliFetch('https://api.vc.bilibili.com/svr_sync/v1/svr_sync/fetch_session_msgs?session_type=1&talker_id='+talkerId+'&size=30&build=0&mobi_app=web',{},8000);
  const list=(d.data&&d.data.messages)||[];
  if(!list.length) return null;
  return list.slice().reverse().map(m=>mapRealMsg(m,myMid)).filter(Boolean);
}

function renderChatMsg(m){

  if(m.type==='system')return `<div class="msg-system"><span>${m.text}</span></div>`;
  if(m.type==='tip')return `<div class="msg-system"><span>${m.text}</span></div>`;
  const selfCls=m.self?'self':'';
  let body='', pushTag='';
  if(m.type==='text'){
    body=`<div class="msg-bubble">${m.text}</div>`;
  }else if(m.type==='image'){
    body=`<div class="msg-bubble" style="padding:4px"><img src="${m.url}" style="width:180px;border-radius:8px;display:block"></div>`;
  }else if(m.type==='video'){
    // UP 更新视频自动推送

      <div class="msg-card-title">${m.title}</div>
      <div class="msg-card-meta">⏱ ${m.duration} · UP: ${m.up}</div></div></div>`;
  }else if(m.type==='article'){
    // 动态 · 专栏推送
    pushTag='动态 · 专栏';
    body=`<div class="msg-card" onclick="showToast('打开专栏')">
      <img src="${m.cover}" alt="" style="aspect-ratio:16/9">
      <div class="msg-card-info"><div class="msg-card-title">${m.title}</div>
      <div class="msg-card-meta">📝 ${m.summary}</div></div></div>`;
  }else if(m.type==='share'){
    pushTag=m.source||'动态';
    body=`<div class="msg-card" onclick="showToast('打开${m.source}')">
      <img src="${m.cover}" alt=""><div class="msg-card-info">
      <div class="msg-card-title">${m.title}</div>
      <div class="msg-card-meta">${m.source} · ${m.up}</div></div></div>`;
  }else if(m.type==='notify'){
    pushTag='系统通知';
    body=`<div class="msg-card" style="max-width:min(440px,92%);width:100%;padding:12px">
      <div style="font-weight:700;font-size:14px;margin-bottom:6px">${m.title}</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:8px">${m.text}</div>
      ${m.modules.map(mod=>`<div style="display:flex;gap:8px;font-size:11px;margin:3px 0"><span style="color:var(--text3);min-width:60px">${mod.title}</span><span>${mod.detail}</span></div>`).join('')}
      </div>`;
  }else if(m.type==='recommend'){
    pushTag='推荐';
    body=`<div class="msg-card" style="max-width:min(440px,92%);width:100%;padding:10px">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px">${m.mainTitle}</div>
      ${m.cards.map(c=>`<div style="display:flex;gap:8px;margin-bottom:8px;cursor:pointer" onclick="showToast('打开：${c.title}')">
        <img src="${c.cover}" style="width:100px;height:56px;object-fit:cover;border-radius:6px">
        <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${c.title}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:3px">${c.meta1} · ${c.meta2}</div></div></div>`).join('')}
      </div>`;
  }
  // 系统推送类卡片居中显示，普通私信气泡保持左右对齐
  if(pushTag)return `<div class="msg-push"><span class="msg-push-tag">${pushTag}</span>${body}</div>`;
  return `<div class="msg-row ${selfCls}"><div class="msg-avatar-sm"></div>${body}</div>`;

function sendChatMsg(){

// ============ Cookie 持久化 + 登录态 ============
const LS_COOKIE='biliflex_web_cookies_v1';
const LS_SESSION='biliflex_web_session_v1';
const CookieStore={
  save(c){try{localStorage.setItem(LS_COOKIE,c||'')}catch(e){}},
  load(){return localStorage.getItem(LS_COOKIE)||''},
  clear(){localStorage.removeItem(LS_COOKIE);localStorage.removeItem(LS_SESSION)},
  get csrf(){const m=Object.fromEntries(this.load().split(';').map(s=>{const i=s.indexOf('=');return i>0?[s.substring(0,i).trim(),s.substring(i+1).trim()]:[s.trim(),'']}));return m['bili_jct']||''},
  get sessdata(){return this.load().match(/SESSDATA=([^;]+)/)?.[1]||''},
  get mid(){return parseInt((this.load().match(/DedeUserID=([^;]+)/)?.[1]||'0'),10)},
  get uname(){try{return JSON.parse(localStorage.getItem(LS_SESSION)||'{}').uname||''}catch(e){return''}},
  get face(){try{return JSON.parse(localStorage.getItem(LS_SESSION)||'{}').face||''}catch(e){return''}},
  get loggedIn(){return this.csrf.length>0 && this.mid>0}
};

// ============ Profile 真实化 ============
function refreshProfile(){
  const n=document.querySelector('.profile-name');
  const u=document.querySelector('.profile-uid');
  const av=document.querySelector('.profile-avatar');
  const stats=document.querySelectorAll('.profile-stats .profile-stat-num');
  if(!n)return;
  if(CookieStore.loggedIn){
    const sess={};try{Object.assign(sess,JSON.parse(localStorage.getItem(LS_SESSION)||'{}'))}catch(e){}
    n.textContent=CookieStore.uname||sess.uname||'BiliFlex用户';
    u.textContent='UID: '+CookieStore.mid;
    if(CookieStore.face){av.innerHTML='<img src="'+CookieStore.face+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">'}
    // 刷新硬币/粉丝等
    try{
      biliFetch('https://api.bilibili.com/x/web-interface/nav').then(d=>{
        const s=d.data;
        n.textContent=s.uname||n.textContent;
        sess.uname=s.uname;sess.face=s.face;sess.mid=s.mid;sess.coins=s.money;
        try{localStorage.setItem(LS_SESSION,JSON.stringify(sess))}catch(e){}
        stats[2]&&(stats[2].textContent=fmtNum(s.money||0));
      });
      biliFetch('https://api.bilibili.com/x/web-interface/nav/stat').then(d=>{
        const s=d.data;
        stats[0]&&(stats[0].textContent=fmtNum(s.following||0));
        stats[1]&&(stats[1].textContent=fmtNum(s.follower||0));
      }).catch(()=>{});
    }catch(e){}
  }else{
    n.textContent='点击登录';
    u.textContent='登录后可同步收藏/历史/消息';
    av.innerHTML='';
    if(stats[0])stats[0].textContent='—';
    if(stats[1])stats[1].textContent='—';
    if(stats[2])stats[2].textContent='—';
  }
}
