name: Build Windows Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:  # 支持手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package release folder
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $dst = "BiliFlex-Windows-x64"
          Copy-Item -Path $src -Destination $dst -Recurse
          Compress-Archive -Path $dst -DestinationPath "BiliFlex-Windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliFlex-Windows-x64
          path: BiliFlex-Windows-x64.zip
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BiliFlex-Windows-x64.zip
          generate_release_notes: true
